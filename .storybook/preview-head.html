<style>
  /* Estilo das páginas de documentação (MDX e autodocs). Só aparência: o conteúdo mora nos arquivos .mdx. */
  .sbdocs-content {
    max-width: 960px;
  }

  .sbdocs-wrapper {
    padding-block: 2.5rem;
  }

  .sbdocs h1:not(.docs-story *),
  .sbdocs h2:not(.docs-story *),
  .sbdocs h3:not(.docs-story *) {
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #0f172a;
  }

  .sbdocs h1:not(.docs-story *) {
    font-size: 2rem;
    color: #0089e2;
    margin-bottom: 0.5rem;
  }

  .sbdocs h2:not(.docs-story *) {
    font-size: 1.375rem;
    margin-top: 2.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #e4e4e7;
  }

  .sbdocs h3:not(.docs-story *) {
    font-size: 1.0625rem;
    margin-top: 1.75rem;
  }

  .sbdocs p:not(.docs-story *),
  .sbdocs li:not(.docs-story *) {
    line-height: 1.7;
  }

  .sbdocs ol:not(.docs-story *) {
    list-style: decimal;
    padding-left: 1.5rem;
  }

  .sbdocs ul:not(.docs-story *) {
    list-style: disc;
    padding-left: 1.5rem;
  }

    margin-top: 0.35rem;
  }

    border-collapse: collapse;

  }

    margin-inline: 0;
    padding: 0.75rem 1rem;
    border-left: 4px solid #0089e2;
    background: #f0f9ff;
    border-radius: 0 6px 6px 0;
    color: #0f172a;
  }

  .sbdocs pre:not(.docs-story *) {
    border-radius: 8px;
  }

  .sbdocs a:not(.docs-story *) {
    color: #0089e2;
  }

      overflow-x: auto;
    }

      font-size: 1.625rem;
    }

  :root[data-contrast='high'] .sbdocs-content,
  :root[data-contrast='high'] .sbdocs {
    background: #000000;
    color: #ffffff;
  }

    border-color: #ffffff;
  }

    border-bottom: 2px solid #ffff00;
  }
